name: Deploy NeuroDrive to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "neurodrive-pages"
  cancel-in-progress: true

env:
  VITE_SUPABASE_URL: https://gicjsuagmiyoqvttbqjw.supabase.co
  VITE_SUPABASE_ANON_KEY: sb_publishable_ovAAaIT0nXzSMiy2KYGHTw_ydsshEzK
  VITE_BASE_PATH: /

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Open core access policy for Pages build
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("src/main.jsx")
          s = p.read_text(encoding="utf-8")
          old = 'const protectedTabs = new Set(["alunos", "agenda", "aulas", "hsi", "rpa", "financeiro"]);'
          new = 'const protectedTabs = new Set([]);'
          if old not in s:
              raise SystemExit("Expected access-policy declaration was not found; build stopped safely.")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Fix NeuroDrive email confirmation flow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("src/main.jsx")
          s = p.read_text(encoding="utf-8")
          original = s

          s = s.replace('function Auth({ onAuth }) {', 'function Auth({ onAuth, initialMessage = "" }) {', 1)
          s = s.replace('const [msg, setMsg] = useState("");\n  const [busy, setBusy] = useState(false);', 'const [msg, setMsg] = useState(initialMessage);\n  const [busy, setBusy] = useState(false);', 1)
          s = s.replace('options: {\n              data: professionalMetadata\n            }', 'options: {\n              emailRedirectTo: "https://neurodrive.hsi-doth-pg.com.br/?confirmed=1",\n              data: professionalMetadata\n            }', 1)
          if 'emailRedirectTo: "https://neurodrive.hsi-doth-pg.com.br/?confirmed=1"' not in s:
              raise SystemExit("Could not add production email redirect; build stopped safely.")

          start = s.index('function Root() {')
          end = s.index('\n\nconst rootElement', start)
          new_root = '''function Root() {
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(true);
  const [configError, setConfigError] = useState("");
  const confirmationRequested = new URLSearchParams(window.location.search).get("confirmed") === "1";

  useEffect(() => {
    let mounted = true;
    if (!supabase) { setConfigError("Supabase não configurado. Verifique VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY no .env."); setLoading(false); return; }

    async function initializeAuth() {
      try {
        const { data, error } = await supabase.auth.getSession();
        if (!mounted) return;
        if (error) console.error("Erro ao recuperar sessão:", error);
        if (confirmationRequested) {
          await supabase.auth.signOut();
          window.history.replaceState({}, document.title, window.location.pathname);
          setUser(null);
        } else {
          setUser(data?.session?.user ?? null);
        }
        setLoading(false);
      } catch (error) {
        console.error("Erro Supabase:", error);
        if (mounted) { setUser(null); setLoading(false); }
      }
    }

    initializeAuth();
    const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
      if (mounted && !confirmationRequested) {
        setUser(session?.user ?? null);
        setLoading(false);
      }
    });
    return () => { mounted = false; subscription?.unsubscribe(); };
  }, []);

  async function logout() { if (supabase) await supabase.auth.signOut(); setUser(null); }
  if (loading) return <div className="auth"><div className="card"><h1>ENAT - Assistente do Instrutor</h1><p>Verificando acesso...</p></div></div>;
  if (configError) return <div className="auth"><div className="card"><h1>Configuração necessária</h1><p className="msg">{configError}</p></div></div>;
  return user ? <Dashboard user={user} onLogout={logout} /> : <Auth onAuth={setUser} initialMessage={confirmationRequested ? "E-mail confirmado com sucesso. Seu cadastro está ativo. Faça login para entrar no NeuroDrive." : ""} />;
}'''
          s = s[:start] + new_root + s[end:]
          if s == original:
              raise SystemExit("No authentication changes were made; build stopped safely.")
          p.write_text(s, encoding="utf-8")
          PY

      - name: Prepare voluntary support page
        run: python scripts/prepare-neurodrive-pages.py

      - name: Normalize financial dashboard
        run: python scripts/normalize-financial-dashboard.py

      - name: Build Vite application
        run: npm run build

      - name: Enable SPA route fallback
        run: cp dist/index.html dist/404.html

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
