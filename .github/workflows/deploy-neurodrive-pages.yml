name: Deploy NeuroDrive to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "neurodrive-pages"
  cancel-in-progress: true

# NeuroDrive uses the dedicated HSI-DOTH-P-G Supabase project.
# The browser key is a publishable/anon key and is safe to ship to the client;
# database access remains protected by Supabase Auth + RLS.
env:
  VITE_SUPABASE_URL: https://gicjsuagmiyoqvttbqjw.supabase.co
  VITE_SUPABASE_ANON_KEY: sb_publishable_ovAAaIT0nXzSMiy2KYGHTw_ydsshEzK
  VITE_BASE_PATH: /

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Open core access policy for Pages build
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("src/main.jsx")
          s = p.read_text(encoding="utf-8")
          old = 'const protectedTabs = new Set(["alunos", "agenda", "aulas", "hsi", "rpa", "financeiro"]);'
          new = 'const protectedTabs = new Set([]);'
          if old not in s:
              raise SystemExit("Expected access-policy declaration was not found; build stopped safely.")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Replace subscription page with voluntary support page
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("src/main.jsx")
          s = p.read_text(encoding="utf-8")

          pattern = re.compile(r'function SubscriptionPage\([\s\S]*?(?=\nfunction [A-Za-z])')
          match = pattern.search(s)
          if not match:
              raise SystemExit("SubscriptionPage was not found; build stopped safely.")

          replacement = r'''function SubscriptionPage({ onBack }) {
            const donationUrl = import.meta.env.VITE_DONATION_URL || "";
            const pixKey = import.meta.env.VITE_DONATION_PIX_KEY || "";
            const [copied, setCopied] = useState(false);

            async function copyPix() {
              if (!pixKey) return;
              try {
                await navigator.clipboard.writeText(pixKey);
                setCopied(true);
                setTimeout(() => setCopied(false), 2200);
              } catch (err) {
                console.error("Não foi possível copiar a chave PIX:", err);
              }
            }

            return (
              <div className="card" style={{ maxWidth: "760px", margin: "0 auto", textAlign: "center" }}>
                <ENATLogo />
                <h1 style={{ marginTop: "18px" }}>Apoie a manutenção do NeuroDrive</h1>
                <p style={{ lineHeight: 1.7, opacity: 0.92 }}>
                  O NeuroDrive é disponibilizado gratuitamente aos instrutores de trânsito.
                  A continuidade, hospedagem, segurança e evolução do sistema dependem de apoio voluntário.
                </p>
                <p style={{ lineHeight: 1.7 }}>
                  <strong>Se você utiliza o sistema e deseja contribuir, qualquer valor é bem-vindo.</strong>
                  <br />
                  A contribuição é espontânea e não condiciona o acesso ao NeuroDrive.
                </p>

                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(130px,1fr))", gap: "10px", margin: "22px 0" }}>
                  {[10, 25, 50, 100].map(value => (
                    <div key={value} style={{ padding: "16px 10px", border: "1px solid rgba(85,191,239,.22)", borderRadius: "12px" }}>
                      <strong>R$ {value},00</strong>
                      <div style={{ fontSize: "12px", opacity: .72, marginTop: "5px" }}>sugestão</div>
                    </div>
                  ))}
                </div>

                {pixKey ? (
                  <div style={{ padding: "18px", borderRadius: "14px", background: "rgba(85,191,239,.07)", border: "1px solid rgba(85,191,239,.20)" }}>
                    <div style={{ fontWeight: 800, marginBottom: "10px" }}>Contribuição via PIX</div>
                    <div style={{ wordBreak: "break-all", fontFamily: "monospace", fontSize: "13px", marginBottom: "12px" }}>{pixKey}</div>
                    <button type="button" onClick={copyPix}>{copied ? "CHAVE COPIADA ✓" : "COPIAR CHAVE PIX"}</button>
                  </div>
                ) : donationUrl ? (
                  <a href={donationUrl} target="_blank" rel="noreferrer" className="button" style={{ display: "inline-block", textDecoration: "none", padding: "12px 20px", borderRadius: "10px" }}>
                    CONTRIBUIR VOLUNTARIAMENTE
                  </a>
                ) : (
                  <div style={{ padding: "16px", borderRadius: "12px", background: "rgba(255,255,255,.04)", opacity: .82 }}>
                    O canal de contribuição voluntária será disponibilizado pelo ENAT.
                  </div>
                )}

                <p style={{ marginTop: "22px", fontSize: "13px", opacity: .68 }}>
                  O apoio é destinado à manutenção técnica, infraestrutura, segurança e desenvolvimento contínuo do NeuroDrive e do ecossistema ENAT-HSI.
                </p>
                <button type="button" className="link" onClick={onBack}>Voltar ao NeuroDrive</button>
              </div>
            );
          }
'''

          s = s[:match.start()] + replacement + s[match.end():]
          p.write_text(s, encoding="utf-8")
          PY

      - name: Build Vite application
        run: npm run build

      - name: Enable SPA route fallback
        run: cp dist/index.html dist/404.html

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
