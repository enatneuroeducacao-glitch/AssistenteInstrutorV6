name: Deploy NeuroDrive Auth Fix

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "neurodrive-pages"
  cancel-in-progress: true

env:
  VITE_SUPABASE_URL: https://gicjsuagmiyoqvttbqjw.supabase.co
  VITE_SUPABASE_ANON_KEY: sb_publishable_ovAAaIT0nXzSMiy2KYGHTw_ydsshEzK
  VITE_BASE_PATH: /

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Patch NeuroDrive authentication for production
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p = Path("src/main.jsx")
          s = p.read_text(encoding="utf-8")
          s = s.replace('function Auth({ onAuth }) {', 'function Auth({ onAuth, initialMessage = "" }) {', 1)
          s = s.replace('const [msg, setMsg] = useState("");', 'const [msg, setMsg] = useState(initialMessage);', 1)
          s = s.replace('options: {\n              data: professionalMetadata\n            }', 'options: {\n              emailRedirectTo: "https://neurodrive.hsi-doth-pg.com.br/?confirmed=1",\n              data: professionalMetadata\n            }', 1)
          root = base64.b64decode("").decode()
          start = s.index("function Root() {")
          end = s.index("\n\nconst rootElement", start)
          s = s[:start] + root + s[end:]
          p.write_text(s, encoding="utf-8")
          PY
      - name: Open core access policy for Pages build
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("src/main.jsx")
          s = p.read_text(encoding="utf-8")
          old = 'const protectedTabs = new Set(["alunos", "agenda", "aulas", "hsi", "rpa", "financeiro"]);'
          if old in s:
              s = s.replace(old, 'const protectedTabs = new Set([]);', 1)
          p.write_text(s, encoding="utf-8")
          PY
      - name: Prepare voluntary support page
        run: python scripts/prepare-neurodrive-pages.py
      - name: Normalize financial dashboard
        run: python scripts/normalize-financial-dashboard.py
      - name: Build Vite application
        run: npm run build
      - name: Enable SPA route fallback
        run: cp dist/index.html dist/404.html
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
