name: Fix NeuroDrive email confirmation redirect

on:
  push:
    paths:
      - '.github/workflows/fix-neurodrive-confirmation.yml'

permissions:
  contents: write

jobs:
  patch-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch auth flow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main.jsx')
          s = p.read_text(encoding='utf-8')
          original = s
          s = s.replace('function Auth({ onAuth }) {', 'function Auth({ onAuth, initialMessage = "" }) {', 1)
          s = s.replace('const [msg, setMsg] = useState("");\n  const [busy, setBusy] = useState(false);', 'const [msg, setMsg] = useState(initialMessage);\n  const [busy, setBusy] = useState(false);', 1)
          s = s.replace('options: {\n              data: professionalMetadata\n            }', 'options: {\n              emailRedirectTo: "https://neurodrive.hsi-doth-pg.com.br/?confirmed=1",\n              data: professionalMetadata\n            }', 1)
          if 'emailRedirectTo: "https://neurodrive.hsi-doth-pg.com.br/?confirmed=1"' not in s:
              raise SystemExit('emailRedirectTo patch failed')
          marker = 'function Root() {'
          start = s.index(marker)
          end = s.index('\n\nconst rootElement', start)
          new = '''function Root() {
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(true);
  const [configError, setConfigError] = useState("");
  const confirmationRequested = new URLSearchParams(window.location.search).get("confirmed") === "1";

  useEffect(() => {
    let mounted = true;
    if (!supabase) { setConfigError("Supabase não configurado. Verifique VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY no .env."); setLoading(false); return; }
    async function initializeAuth() {
      try {
        const { data, error } = await supabase.auth.getSession();
        if (!mounted) return;
        if (error) console.error("Erro ao recuperar sessão:", error);
        if (confirmationRequested) {
          await supabase.auth.signOut();
          window.history.replaceState({}, document.title, window.location.pathname);
          setUser(null);
        } else {
          setUser(data?.session?.user ?? null);
        }
        setLoading(false);
      } catch (error) {
        console.error("Erro Supabase:", error);
        if (mounted) { setUser(null); setLoading(false); }
      }
    }
    initializeAuth();
    const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
      if (mounted && !confirmationRequested) {
        setUser(session?.user ?? null);
        setLoading(false);
      }
    });
    return () => { mounted = false; subscription?.unsubscribe(); };
  }, []);

  async function logout() { if (supabase) await supabase.auth.signOut(); setUser(null); }
  if (loading) return <div className="auth"><div className="card"><h1>ENAT - Assistente do Instrutor</h1><p>Verificando acesso...</p></div></div>;
  if (configError) return <div className="auth"><div className="card"><h1>Configuração necessária</h1><p className="msg">{configError}</p></div></div>;
  return user ? <Dashboard user={user} onLogout={logout} /> : <Auth onAuth={setUser} initialMessage={confirmationRequested ? "E-mail confirmado com sucesso. Seu cadastro está ativo. Faça login para entrar no NeuroDrive." : ""} />;
}'''
          s = s[:start] + new + s[end:]
          if s == original:
              raise SystemExit('No changes made')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.jsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix: redirect confirmed NeuroDrive users to login'
          git push
