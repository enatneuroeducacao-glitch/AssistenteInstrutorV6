<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assistente do Instrutor</title>
</head>
<body>
  <a href="/admin-login" aria-label="Acesso administrativo ENAT" style="position:fixed;top:14px;right:14px;z-index:9999;padding:9px 13px;border-radius:8px;background:#0b172b;color:#fff;text-decoration:none;font:700 12px Arial,sans-serif;letter-spacing:.04em;border:1px solid rgba(85,191,239,.35);box-shadow:0 4px 14px rgba(0,0,0,.14)">ENAT ADMIN</a>
  <div id="root"></div>
  <script type="module">
    if (window.location.pathname === "/admin-access") {
      import("/src/admin-dashboard.jsx");
    } else if (window.location.pathname === "/admin-login") {
      import("/src/admin-login.jsx");
    } else if (window.location.pathname === "/admin-instructors") {
      import("/src/admin-instructors.jsx");
    } else {
      import("/src/main.jsx");
      import("/src/PredictiveAIOverlay.jsx");
    }
  </script>
  <style>
    .dashboard-shell .main-sidebar .nav.icon-nav,
    .dashboard-shell .main-sidebar > .nav {
      height: 72px !important;
      min-height: 72px !important;
      flex-direction: column !important;
      justify-content: center !important;
      align-items: center !important;
      gap: 5px !important;
      padding: 7px 6px !important;
      text-align: center !important;
      border-radius: 13px !important;
    }
    .dashboard-shell .main-sidebar .nav.icon-nav svg,
    .dashboard-shell .main-sidebar > .nav svg {
      width: 25px !important;
      height: 25px !important;
      flex: 0 0 auto !important;
    }
    .dashboard-shell .main-sidebar .nav.icon-nav::after {
      content: attr(title) !important;
      display: block !important;
      color: inherit !important;
      font-size: 9px !important;
      line-height: 1.1 !important;
      font-weight: 800 !important;
      letter-spacing: .045em !important;
      text-transform: uppercase !important;
      white-space: nowrap !important;
    }
    .dashboard-shell .main-sidebar .nav.logout span {
      display: block !important;
      font-size: 9px !important;
      line-height: 1.1 !important;
      font-weight: 800 !important;
      letter-spacing: .045em !important;
    }
    .dashboard-shell .main-sidebar .nav.logout {
      height: 72px !important;
      min-height: 72px !important;
    }
    @media (max-width: 900px) {
      .dashboard-shell .main-sidebar {
        width: 92px !important;
        flex-basis: 92px !important;
        padding: 12px 8px !important;
      }
      .dashboard-shell .main-sidebar .nav.icon-nav,
      .dashboard-shell .main-sidebar > .nav {
        height: 68px !important;
        min-height: 68px !important;
      }
      .dashboard-shell .main-sidebar .nav.icon-nav::after,
      .dashboard-shell .main-sidebar .nav.logout span {
        font-size: 8px !important;
      }
    }
  </style>
  <link rel="stylesheet" href="/menu-fix.css?v=2" />
</body>
</html>
