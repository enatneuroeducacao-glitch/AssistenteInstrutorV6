<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>NEURODRIVE INSTRUTOR ENAT-HSI</title>
  <link rel="icon" type="image/png" href="./enat-logo.png?v=2" />
  <link rel="shortcut icon" type="image/png" href="./enat-logo.png?v=2" />
  <link rel="apple-touch-icon" href="./enat-logo.png?v=2" />
  <link rel="stylesheet" href="./neurodrive-theme-v1.css" />
  <script>
    // Administrative route must never be indexed by search engines.
    if (window.location.pathname === "/admin-access" || window.location.pathname.startsWith("/admin-access/")) {
      const meta = document.createElement("meta");
      meta.name = "robots";
      meta.content = "noindex, nofollow, noarchive";
      document.head.appendChild(meta);
    }
  </script>
  <style>
    /* Login-only branding. The existing artwork is rendered explicitly here. */
    .login-brand-static{display:none;position:fixed;top:18px;left:50%;transform:translateX(-50%);width:min(760px,96vw);align-items:center;justify-content:center;gap:18px;z-index:1000;pointer-events:none;}
    .login-brand-static img{display:block;width:180px;height:180px;object-fit:contain;}
    body:has(.auth) .login-brand-static{display:flex;}

    .auth{position:relative!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:flex-start!important;gap:12px!important;padding:220px 12px 30px!important;overflow:auto!important;}
    .auth > div:first-of-type{display:none!important;}
    .auth .card{width:min(520px,96vw)!important;margin:0!important;position:relative!important;z-index:2!important;}

    @media (max-width:650px){
      .login-brand-static{top:10px;width:100%;gap:8px;}
      .login-brand-static img{width:135px;height:135px;}
      .auth{gap:8px!important;padding:165px 10px 26px!important;}
    }

    @media (max-width:380px){
      .login-brand-static{gap:4px;}
      .login-brand-static img{width:120px;height:120px;}
      .auth{padding-top:150px!important;}
    }
  </style>
</head>
<body>
  <div class="login-brand-static" aria-label="ENAT e Neurociência Aplicada ao Trânsito">
    <img src="./neurociencia-aplicada.webp" alt="Neurociência Aplicada ao Trânsito" />
    <img src="./enat-logo.png?v=3" alt="ENAT — Ensino Neuroeducacional Aplicado ao Trânsito" />
  </div>
  <div id="root"></div>
  <script type="module">
    if (window.location.pathname === "/admin-access") {
      import("./src/admin.jsx");
    } else {
      import("./src/main.jsx");
      import("./src/PredictiveAIOverlay.jsx");
    }
  </script>
</body>
</html>
