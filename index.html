<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>NEURODRIVE INSTRUTOR ENAT-HSI</title>
  <link rel="icon" type="image/png" href="./enat-logo.png?v=2" />
  <link rel="shortcut icon" type="image/png" href="./enat-logo.png?v=2" />
  <link rel="apple-touch-icon" href="./enat-logo.png?v=2" />
  <link rel="stylesheet" href="./neurodrive-theme-v1.css" />
  <style>
    /* Login brand lockup: use the existing original artwork only. */
    .auth{
      position:relative!important;
      background-image:url("/neurociencia-aplicada.webp")!important;
      background-repeat:no-repeat!important;
      background-size:260px auto!important;
      background-position:center 28px!important;
      padding-top:250px!important;
      gap:14px!important;
      justify-content:flex-start!important;
    }

    /* Desktop: keep both institutional identities visible without a black wrapper. */
    .auth:after{
      content:""!important;
      display:block!important;
      position:absolute!important;
      top:42px!important;
      right:max(24px,calc(50% - 610px))!important;
      width:190px!important;
      height:190px!important;
      background-image:url("/enat-logo.png?v=2")!important;
      background-repeat:no-repeat!important;
      background-position:center!important;
      background-size:contain!important;
      pointer-events:none!important;
      filter:drop-shadow(0 12px 24px rgba(0,0,0,.22))!important;
    }

    /* Existing ENAT panel becomes a transparent brand block. */
    .auth > div:first-of-type{
      display:flex!important;
      width:min(520px,96vw)!important;
      max-width:520px!important;
      padding:0!important;
      margin:0!important;
      border:0!important;
      border-radius:0!important;
      background:transparent!important;
      box-shadow:none!important;
      box-sizing:border-box!important;
      position:relative!important;
      z-index:2!important;
    }

    .auth > div:first-of-type img{
      width:180px!important;
      max-width:180px!important;
    }

    .auth > div:first-of-type > div:last-child{
      margin-top:8px!important;
      font-size:18px!important;
    }

    .auth .card{
      position:relative!important;
      z-index:2!important;
      margin:0!important;
    }

    @media (min-width:1051px){
      .auth{
        padding-top:250px!important;
      }
      .auth > div:first-of-type{
        max-width:520px!important;
      }
    }

    @media (max-width:1050px){
      .auth{
        background-size:260px auto!important;
        background-position:center 16px!important;
        padding-top:238px!important;
        gap:12px!important;
      }

      .auth:after{
        display:none!important;
      }

      .auth > div:first-of-type{
        width:100%!important;
        max-width:520px!important;
      }
    }

    @media (max-width:650px){
      .auth{
        background-size:250px auto!important;
        background-position:center 12px!important;
        padding:224px 10px 28px!important;
        gap:10px!important;
      }

      .auth > div:first-of-type{
        width:100%!important;
        max-width:520px!important;
      }

      .auth > div:first-of-type img{
        width:165px!important;
        max-width:165px!important;
      }

      .auth > div:first-of-type > div:last-child{
        margin-top:7px!important;
        font-size:17px!important;
      }
    }

    @media (max-width:380px){
      .auth{
        background-size:225px auto!important;
        background-position:center 10px!important;
        padding-top:204px!important;
      }

      .auth > div:first-of-type img{
        width:150px!important;
        max-width:150px!important;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    if (window.location.pathname === "/admin-access") {
      import("./src/admin.jsx");
    } else {
      import("./src/main.jsx");
      import("./src/PredictiveAIOverlay.jsx");
    }
  </script>
</body>
</html>
