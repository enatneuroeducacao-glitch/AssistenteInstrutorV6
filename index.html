<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#123e78" />
  <meta name="description" content="ENAT — Ensino Neuroeducacional Aplicado ao Trânsito. Assistente do Instrutor de Trânsito com ferramentas pedagógicas e de segurança viária." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NeuroDrive" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="/neurodrive-icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/neurodrive-icon-180.png">
  <title>NeuroDrive — ENAT | Ensino Neuroeducacional Aplicado ao Trânsito</title>
  <style>
    #neurodrive-install-fab{position:fixed!important;right:max(20px,env(safe-area-inset-right))!important;bottom:max(22px,env(safe-area-inset-bottom))!important;z-index:2147483647!important;display:flex!important;visibility:visible!important;opacity:1!important;align-items:center;gap:9px;padding:13px 18px;border:0;border-radius:999px;background:#1264bd;color:#fff;font:800 14px/1.1 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;box-shadow:0 8px 24px rgba(7,26,53,.3);cursor:pointer;letter-spacing:.1px;transition:transform .15s,box-shadow .15s}
    #neurodrive-install-fab[hidden]{display:none!important}
    #neurodrive-install-fab:hover{transform:translateY(-2px);box-shadow:0 11px 28px rgba(7,26,53,.36)}
    #neurodrive-install-fab:focus-visible{outline:3px solid #f6b72b;outline-offset:3px}
    #neurodrive-install-fab svg{width:19px;height:19px;flex:none}
    #neurodrive-install-note{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:calc(max(22px,env(safe-area-inset-bottom)) + 60px);z-index:2147483000;max-width:min(310px,calc(100vw - 32px));padding:12px 14px;border-radius:12px;background:#071a35;color:#fff;font:500 13px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;box-shadow:0 6px 20px rgba(7,26,53,.25)}
    @media(max-width:480px){#neurodrive-install-fab{right:14px;bottom:max(14px,env(safe-area-inset-bottom));padding:12px 15px;font-size:13px}#neurodrive-install-note{right:14px;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 56px)}}
    @media print{#neurodrive-install-fab,#neurodrive-install-note{display:none!important}}
  </style>
</head>
<body>
  <div id="root"></div>
  <button id="neurodrive-install-fab" type="button" aria-label="Instalar aplicativo NeuroDrive">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v11m0 0 4-4m-4 4-4-4M5 16v4h14v-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Instalar NeuroDrive</span>
  </button>
  <script>
    (() => {
      let button = document.getElementById("neurodrive-install-fab");
      if (!button) {
        button = document.createElement("button");
        button.id = "neurodrive-install-fab";
        button.type = "button";
        button.setAttribute("aria-label", "Instalar aplicativo NeuroDrive");
        button.innerHTML = '<span aria-hidden="true">⬇</span><span>Instalar NeuroDrive</span>';
        document.body.appendChild(button);
      }
      let installPrompt = null;
      let noteTimer = null;
      const isStandalone = () => window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
      const hideButton = () => { button.hidden = true; };
      const showNote = (message) => {
        let note = document.getElementById("neurodrive-install-note");
        if (!note) {
          note = document.createElement("div");
          note.id = "neurodrive-install-note";
          note.setAttribute("role", "status");
          note.setAttribute("aria-live", "polite");
          document.body.appendChild(note);
        }
        note.textContent = message;
        clearTimeout(noteTimer);
        noteTimer = setTimeout(() => note.remove(), 9000);
      };
      // Mantém o botão visível também em modo standalone; o usuário pode precisar consultar as instruções.
      button.hidden = false;
      // Garante o botão mesmo em navegadores móveis que não disparam beforeinstallprompt.
      button.style.setProperty("display", "flex", "important");
      button.style.setProperty("visibility", "visible", "important");
      button.style.setProperty("opacity", "1", "important");
      window.addEventListener("beforeinstallprompt", (event) => {
        event.preventDefault();
        installPrompt = event;
        button.hidden = false;
      });
      window.addEventListener("appinstalled", () => {
        installPrompt = null;
        button.hidden = false;
        showNote("NeuroDrive instalado. Se precisar reinstalar ou consultar opções, use o menu do navegador.");
      });
      button.addEventListener("click", async () => {
        if (installPrompt) {
          installPrompt.prompt();
          const choice = await installPrompt.userChoice;
          installPrompt = null;
          if (choice && choice.outcome === "accepted") hideButton();
          else showNote("A instalação não foi concluída. Você pode tentar novamente pelo menu do navegador.");
          return;
        }
        const ua = navigator.userAgent || "";
        if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
          showNote('Para instalar no iPhone/iPad: toque em Compartilhar e escolha “Adicionar à Tela de Início”.');
        } else {
          showNote('Para instalar: abra o menu ⋮ do navegador e escolha “Instalar NeuroDrive” ou “Instalar aplicativo”. Se essa opção não aparecer, atualize a página e tente novamente.');
        }
      });
    })();
  </script>
  <script>
    if ("serviceWorker" in navigator && location.protocol === "https:") {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js", { scope: "/" })
          .catch((error) => console.warn("NeuroDrive PWA: falha ao registrar Service Worker", error));
      });
    }
  </script>
  <script type="module">
    if (window.location.pathname === "/admin-access") {
      import("./src/admin.jsx");
    } else {
      import("./src/main.jsx").catch((error) => {
        console.error("Erro ao carregar o NeuroDrive:", error);
        const root = document.getElementById("root");
        if (root) {
          root.innerHTML = `<div style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f7fb;font-family:Arial,sans-serif;color:#17345f"><div style="max-width:720px;background:#fff;border:1px solid #dfe7f0;border-radius:16px;padding:28px;box-shadow:0 14px 35px rgba(8,28,53,.12)"><h1 style="margin-top:0">NeuroDrive — carregamento interrompido</h1><p>O aplicativo encontrou um erro ao carregar. Recarregue a página. Se o problema persistir, esta mensagem permite identificar o erro sem deixar a tela azul.</p><pre style="white-space:pre-wrap;background:#f6f8fb;padding:12px;border-radius:8px;overflow:auto">${String(error?.message || error)}</pre><button onclick="location.reload()" style="margin-top:12px;padding:11px 16px;border:0;border-radius:8px;background:#1675d1;color:#fff;font-weight:800;cursor:pointer">RECARREGAR</button></div></div>`;
        }
      });
    }
  </script>
</body>
</html>
