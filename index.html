<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#12345a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="NeuroDrive" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" href="/enat-logo.png?v=7" />
  <link rel="shortcut icon" type="image/png" href="/enat-logo.png?v=7" />
  <link rel="apple-touch-icon" href="/enat-logo.png?v=7" />
  <title>NEURODRIVE INSTRUTOR ENAT-HSI</title>
  <style>
    #neurodrive-install {
      position: fixed; z-index: 10000; right: max(16px, env(safe-area-inset-right));
      bottom: max(16px, env(safe-area-inset-bottom)); display: none; border: 0;
      border-radius: 999px; padding: 13px 18px; background: #1675d1; color: #fff;
      font: 800 14px/1.2 system-ui, sans-serif; box-shadow: 0 8px 28px #081c3533;
      cursor: pointer; touch-action: manipulation;
    }
    @media (max-width: 600px) {
      #neurodrive-install { left: 16px; right: 16px; bottom: max(12px, env(safe-area-inset-bottom)); width: calc(100% - 32px); }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <button id="neurodrive-install" type="button" aria-label="Instalar NeuroDrive no celular">Instalar NeuroDrive</button>
  <script type="module">
    if (window.location.pathname === "/admin-access") {
      import("./src/admin.jsx");
    } else {
      import("./src/main.jsx").catch((error) => {
        console.error("Erro ao carregar o NeuroDrive:", error);
        const root = document.getElementById("root");
        if (root) {
          root.innerHTML = `<div style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f7fb;font-family:Arial,sans-serif;color:#17345f"><div style="max-width:720px;background:#fff;border:1px solid #dfe7f0;border-radius:16px;padding:28px;box-shadow:0 14px 35px rgba(8,28,53,.12)"><h1 style="margin-top:0">NeuroDrive — carregamento interrompido</h1><p>O aplicativo encontrou um erro ao carregar. Recarregue a página. Se o problema persistir, esta mensagem permite identificar o erro sem deixar a tela azul.</p><pre style="white-space:pre-wrap;background:#f6f8fb;padding:12px;border-radius:8px;overflow:auto">${String(error?.message || error)}</pre><button onclick="location.reload()" style="margin-top:12px;padding:11px 16px;border:0;border-radius:8px;background:#1675d1;color:#fff;font-weight:800;cursor:pointer">RECARREGAR</button></div></div>`;
        }
      });
    }
  </script>
  <script>
    (() => {
      const button = document.getElementById("neurodrive-install");
      let installPrompt = null;
      const isStandalone = () => window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
      if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
        window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch((error) => console.warn("NeuroDrive: registro PWA indisponível", error)));
      }
      window.addEventListener("beforeinstallprompt", (event) => {
        event.preventDefault();
        installPrompt = event;
        if (!isStandalone()) button.style.display = "block";
      });
      window.addEventListener("appinstalled", () => {
        installPrompt = null;
        button.style.display = "none";
      });
      button.addEventListener("click", async () => {
        if (installPrompt) {
          installPrompt.prompt();
          await installPrompt.userChoice;
          installPrompt = null;
          button.style.display = "none";
          return;
        }
        if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !isStandalone()) {
          alert('Para instalar o NeuroDrive: toque em Compartilhar no Safari e escolha “Adicionar à Tela de Início”.');
        }
      });
    })();
  </script>
</body>
</html>
